name: Sugerir melhoria
description: Uma ideia de recurso ou ajuste
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que problema isso resolve
      description: Descreva a situação de uso antes de descrever a solução.
    validations:
      required: true

  - type: textarea
    id: proposta
    attributes:
      label: Proposta
    validations:
      required: true

  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
